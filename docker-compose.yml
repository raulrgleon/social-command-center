services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: mesa
      POSTGRES_PASSWORD: mesa
      POSTGRES_DB: mesa
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mesa"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mesa
      MINIO_ROOT_PASSWORD: mesa-mesa-mesa
    volumes:
      - minio:/data
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      REDIS_URL: redis://redis:6379
      DISABLE_INPROCESS_WORKER: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    env_file: .env
    command: ["sh", "docker/start.sh", "worker"]
    environment:
      DATABASE_URL: postgresql://mesa:mesa@postgres:5432/mesa
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pg:
  minio:
